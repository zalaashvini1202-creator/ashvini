<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple AI Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            color: #666;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 Simple AI Model</h1>

    <p>
        Enter flower measurements and let the AI predict the flower type.
    </p>

    <label>Sepal Length</label>
    <input type="number" id="sepalLength" value="5.1" step="0.1">

    <label>Sepal Width</label>
    <input type="number" id="sepalWidth" value="3.5" step="0.1">

    <label>Petal Length</label>
    <input type="number" id="petalLength" value="1.4" step="0.1">

    <label>Petal Width</label>
    <input type="number" id="petalWidth" value="0.2" step="0.1">

    <button onclick="predict()">
        🔮 Predict
    </button>

    <div id="result">
        Prediction will appear here
    </div>

</div>

<script>

/*
    SIMPLE AI MODEL

    This is a small decision-tree-style model
    based on Iris flower characteristics.
*/

function predict() {

    const sepalLength =
        Number(document.getElementById("sepalLength").value);

    const sepalWidth =
        Number(document.getElementById("sepalWidth").value);

    const petalLength =
        Number(document.getElementById("petalLength").value);

    const petalWidth =
        Number(document.getElementById("petalWidth").value);

    let prediction;
    let confidence;

    /*
        Simple trained-model-like rules
    */

    if (petalLength < 2.5 && petalWidth < 1) {

        prediction = "Iris Setosa";
        confidence = "98%";

    } else if (petalLength < 5 &&
               petalWidth < 1.7) {

        prediction = "Iris Versicolor";
        confidence = "94%";

    } else {

        prediction = "Iris Virginica";
        confidence = "95%";
    }

    document.getElementById("result").innerHTML =
        "🌸 Prediction: " + prediction +
        "<br><br>" +
        "AI Confidence: " + confidence;
}

</script>

</body>
</html>
