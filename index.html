<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud AI Sentiment Model</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      width: 400px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      margin: 15px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>AI Sentiment Analyzer</h1>

    <textarea
      id="text"
      placeholder="Enter some text..."
    ></textarea>

    <button onclick="analyzeText()">
      Analyze with AI
    </button>

    <div id="result">
      Result will appear here
    </div>
  </div>

  <script>
    async function analyzeText() {
      const text = document.getElementById("text").value;
      const result = document.getElementById("result");

      if (!text.trim()) {
        result.innerText = "Please enter some text.";
        return;
      }

      result.innerText = "Analyzing...";

      try {
        // Replace this with your deployed cloud AI endpoint
        const API_URL = "https://your-cloud-api.com/predict";

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: text
          })
        });

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const data = await response.json();

        result.innerText =
          "Prediction: " + data.prediction;

      } catch (error) {
        result.innerText =
          "Error connecting to the cloud AI model.";
        console.error(error);
      }
    }
  </script>

</body>
</html>
